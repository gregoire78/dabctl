name: Build & Release WASM

on:
  workflow_call:

permissions:
  contents: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: runtime
            features: wasm-runtime
          - variant: faad2
            features: wasm-faad2

    env:
      LIBFEC_WASM_LIB_DIR: third_party/libfec/wasm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config libusb-1.0-0-dev librtlsdr-dev \
            libmpg123-dev libfec-dev wasi-libc \
            clang libclang-dev \
            jq cmake

      - name: Set up Rust
        run: rustup update stable

      - name: Set up wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked

      - name: Resolve version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build wasm release
        run: cargo build --release --target wasm32-unknown-unknown --features ${{ matrix.features }}

      - name: Generate bindgen package
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p "pkg-${VARIANT}"
          wasm-bindgen target/wasm32-unknown-unknown/release/dabctl.wasm \
            --target web \
            --out-dir "pkg-${VARIANT}" \
            --out-name dabctl

      - name: Package wasm artifacts
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          cp target/wasm32-unknown-unknown/release/dabctl.wasm "dabctl-$VERSION-wasm-$VARIANT-raw.wasm"
          tar -czf "dabctl-$VERSION-wasm-$VARIANT-bindgen-pkg.tar.gz" -C "pkg-$VARIANT" .
          tar -czf "dabctl-$VERSION-wasm-$VARIANT-raw.tar.gz" "dabctl-$VERSION-wasm-$VARIANT-raw.wasm"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts-${{ matrix.variant }}
          path: |
            dabctl-*-wasm-${{ matrix.variant }}-bindgen-pkg.tar.gz
            dabctl-*-wasm-${{ matrix.variant }}-raw.tar.gz
