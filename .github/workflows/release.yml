name: Build & Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*'  # Ex: v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ fromJSON(matrix.info).runner }}
    strategy:
      matrix:
        info:
          - '{ "name": "linux_amd64",      "runner": "ubuntu-latest",    "cargo_args": "--target x86_64-unknown-linux-gnu",                                      "artifact": "target/x86_64-unknown-linux-gnu/release/dabctl", "fdk": false, "latm_only": false }'
          - '{ "name": "linux_arm64",      "runner": "ubuntu-24.04-arm", "cargo_args": "",                                                                           "artifact": "target/release/dabctl",                          "fdk": false, "latm_only": false }'
          - '{ "name": "linux_amd64_fdk",  "runner": "ubuntu-latest",    "cargo_args": "--target x86_64-unknown-linux-gnu --features fdk-aac",                      "artifact": "target/x86_64-unknown-linux-gnu/release/dabctl", "fdk": true,  "latm_only": false }'
          - '{ "name": "linux_arm64_fdk",  "runner": "ubuntu-24.04-arm", "cargo_args": "--features fdk-aac",                                                        "artifact": "target/release/dabctl",                          "fdk": true,  "latm_only": false }'
          - '{ "name": "linux_amd64_latm", "runner": "ubuntu-latest",    "cargo_args": "--target x86_64-unknown-linux-gnu --features latm-only",                    "artifact": "target/x86_64-unknown-linux-gnu/release/dabctl", "fdk": false, "latm_only": true  }'
          - '{ "name": "linux_arm64_latm", "runner": "ubuntu-24.04-arm", "cargo_args": "--features latm-only",                                                      "artifact": "target/release/dabctl",                          "fdk": false, "latm_only": true  }'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          PKGS="pkg-config libusb-1.0-0-dev librtlsdr-dev libmpg123-dev libfec-dev clang libclang-dev jq cmake"
          if [ "${{ fromJSON(matrix.info).latm_only }}" != "true" ]; then
            PKGS="$PKGS libfaad-dev"
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $PKGS

      - name: Install libfdk-aac-dev
        if: fromJSON(matrix.info).fdk
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libfdk-aac-dev

      - name: Set up Rust
        run: rustup update stable

      - name: Build
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cargo build --release ${{ fromJSON(matrix.info).cargo_args }}
          BIN="dabctl-$VERSION-${{ fromJSON(matrix.info).name }}"
          cp ${{ fromJSON(matrix.info).artifact }} "$BIN"
          tar -czf "$BIN.tar.gz" "$BIN"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ fromJSON(matrix.info).name }}
          path: dabctl-*-${{ fromJSON(matrix.info).name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
