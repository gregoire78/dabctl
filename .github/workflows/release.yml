name: Build & Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*'  # Ex: v1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: linux_amd64
            runner: ubuntu-latest
            cargo_args: --target x86_64-unknown-linux-gnu
            artifact: target/x86_64-unknown-linux-gnu/release/dabctl
          - name: linux_arm64
            runner: ubuntu-24.04-arm
            cargo_args: ""
            artifact: target/release/dabctl
          - name: linux_amd64_fdk
            runner: ubuntu-latest
            cargo_args: --target x86_64-unknown-linux-gnu --features fdk-aac
            artifact: target/x86_64-unknown-linux-gnu/release/dabctl
          - name: linux_arm64_fdk
            runner: ubuntu-24.04-arm
            cargo_args: --features fdk-aac
            artifact: target/release/dabctl
          - name: linux_amd64_latm
            runner: ubuntu-latest
            cargo_args: --target x86_64-unknown-linux-gnu --features latm-only
            artifact: target/x86_64-unknown-linux-gnu/release/dabctl
          - name: linux_arm64_latm
            runner: ubuntu-24.04-arm
            cargo_args: --features latm-only
            artifact: target/release/dabctl

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config libusb-1.0-0-dev librtlsdr-dev \
            libmpg123-dev libfec-dev \
            clang libclang-dev \
            jq cmake

      - name: Install libfaad-dev
        if: ${{ !contains(matrix.name, '_latm') }}
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libfaad-dev

      - name: Install libfdk-aac-dev
        if: ${{ contains(matrix.name, '_fdk') }}
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libfdk-aac-dev

      - name: Set up Rust
        run: rustup update stable

      - name: Build
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cargo build --release ${{ matrix.cargo_args }}
          ARTIFACT="${{ matrix.artifact }}"
          BIN="dabctl-$VERSION-${{ matrix.name }}"
          cp "$ARTIFACT" "$BIN"
          tar -czf "dabctl-$VERSION-${{ matrix.name }}.tar.gz" "$BIN"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: dabctl-*-${{ matrix.name }}.tar.gz

  build-wasm:
    uses: ./.github/workflows/release-wasm.yml

  release:
    needs:
      - build
      - build-wasm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
