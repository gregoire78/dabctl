[package]
name = "dabctl"
version = "4.6.5"
edition = "2021"
authors = ["gregoire78"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
arrayvec = "0.7"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
encoding_rs = "0.8.35"
serde_json = "1.0"
rayon = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "unstable-locales"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = "3.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[features]
# Enable the Fraunhofer fdk-aac decoder instead of the default faad2.
# Install libfdk-aac-dev and build with: cargo build --features fdk-aac
fdk-aac = []
# Restrict runtime behavior to LATM output (release flavor for transport-only usage).
latm-only = []
# Prepare runtime constraints for future WebAssembly embedding.
wasm-runtime = ["latm-only"]
# WebAssembly build with faad2 AAC decoding to raw PCM.
# Requires a wasm32-compatible libfaad.a provided at link time.
wasm-faad2 = ["wasm-runtime"]

[[bin]]
name = "dabctl"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
