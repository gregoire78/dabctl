[package]
name = "dabctl"
version = "4.2.3"
edition = "2021"
authors = ["gregoire78"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
arrayvec = "0.7"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = "3.4"
base64 = "0.22"
encoding_rs = "0.8.35"
serde_json = "1.0"
rayon = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "unstable-locales"] }

[features]
# Enable the Fraunhofer fdk-aac decoder instead of the default faad2.
# Install libfdk-aac-dev and build with: cargo build --features fdk-aac
fdk-aac = []
# LATM/ADTS-only build: no libfaad2/libfdk-aac dependency.
# Disables PCM decode and all-services-out; supports only one-service-out
# with --audio-out adts or --audio-out latm (default: latm).
# Build with: cargo build --release --features latm-only
latm-only = []

[[bin]]
name = "dabctl"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
